name: UptimeDrill checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRED_TEST_PROJECT: cred-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate Python syntax
        run: python -m compileall -q app.py monitor.py tests
      - name: Test local service and monitor
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build, start, test, recover and clean up Linux service
        env:
          CRED_TEST_DOCKER: '1'
        run: python -m unittest discover -s tests -v
      - name: Final container cleanup
        if: always()
        run: docker compose --project-name "$CRED_TEST_PROJECT" down --timeout 5
